site_name: Shingeki
site_description: Documentação do projeto Shingeki — DAST, SAST, API Laravel e client web
site_url: https://allancordova.github.io/shingeki/
dev_addr: 127.0.0.1:8001
repo_url: https://github.com/AllanCordova/shingeki
repo_name: AllanCordova/shingeki
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit

plugins:
  - search:
      lang: pt

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Shingeki:
    - Início: index.md
    - Como rodar: RUN-PROJECT.md
  - Arquitetura:
    - Visão geral: ARCHITECTURE.md
    - shingeki-api: architecture/shingeki-api.md
    - shingeki-client: architecture/shingeki-client.md
    - shingeki-dast-worker: architecture/shingeki-dast-worker.md
    - shingeki-sast-worker: architecture/shingeki-sast-worker.md
    - shingeki-vulnerable-target: architecture/shingeki-vulnerable-target.md
  - API:
    - Visão geral: API.md
    - Conta e recursos:
      - Autenticação: api/AUTHENTICATION.md
      - Projetos e sistemas: api/PROJECTS-AND-SYSTEMS.md
      - Stacks: api/STACKS.md
      - Capas: api/COVERS.md
    - Scan e segurança:
      - Aceite de responsabilidade: api/ATTACK-ACKNOWLEDGMENT.md
      - Sessão do alvo: api/TARGET-SESSION.md
      - Ataques e resultados: api/ATTACKS-AND-RESULTS.md
      - Arsenal manual: api/MANUAL-PROXY.md
      - Notificações: api/NOTIFICATIONS.md
    - Catálogo e remediação:
      - Catálogo global: api/CATALOG.md
      - Importação CSV: api/CATALOG-BULK-IMPORT.md
      - Remediação: api/REMEDIATION.md
  - Clientes:
    - Visão geral: CLIENTS.md
    - Web (Next.js): WEB-DEVELOPMENT.md
  - CI:
    - Visão geral: ci/overview.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AllanCordova/shingeki
