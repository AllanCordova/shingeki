name: CI

on:
  push:
  pull_request:

env:
  PHP_VERSION: "8.4"

defaults:
  run:
    working-directory: shingeki-api

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: shingeki-api/vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('shingeki-api/composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fix code style (Laravel Pint)
        if: ${{ hashFiles('shingeki-api/vendor/bin/pint') != '' }}
        run: vendor/bin/pint

      - name: Verify code style (Laravel Pint)
        if: ${{ hashFiles('shingeki-api/vendor/bin/pint') != '' }}
        run: vendor/bin/pint --test

  tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: shingeki-api/vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('shingeki-api/composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: composer test

  dast-worker:
    name: DAST worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shingeki-dast-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: shingeki-dast-worker/go.mod
          cache-dependency-path: shingeki-dast-worker/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
