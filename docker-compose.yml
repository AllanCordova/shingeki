services:
  mysql:
    image: mysql:8.4
    container_name: shingeki-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot $${MYSQL_ROOT_PASSWORD:+-p$$MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shingeki

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shingeki-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmqctl await_startup && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - shingeki

  api-consumers:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.consumers
    container_name: shingeki-api-consumers
    restart: unless-stopped
    env_file:
      - .env
      - path: ./apps/api/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - shingeki

  sast-worker:
    profiles: ["stack"]
    build:
      context: ./workers/sast
      dockerfile: deployments/Dockerfile
    container_name: shingeki-sast-worker
    restart: unless-stopped
    env_file:
      - .env
      - path: ./workers/sast/.env
        required: false
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_ATTACKS_DISPATCH_QUEUE: ${RABBITMQ_ATTACKS_SAST_DISPATCH_QUEUE:-attacks.sast.dispatch}
      RABBITMQ_ATTACKS_RESULTS_QUEUE: ${RABBITMQ_ATTACKS_RESULTS_QUEUE:-attacks.results}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - shingeki

  dast-worker:
    profiles: ["stack"]
    build:
      context: ./workers/dast
      dockerfile: deployments/Dockerfile
    container_name: shingeki-dast-worker
    restart: unless-stopped
    env_file:
      - .env
      - path: ./workers/dast/.env
        required: false
    network_mode: host
    environment:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_ATTACKS_DISPATCH_QUEUE: ${RABBITMQ_ATTACKS_DISPATCH_QUEUE:-attacks.dispatch}
      RABBITMQ_ATTACKS_RESULTS_QUEUE: ${RABBITMQ_ATTACKS_RESULTS_QUEUE:-attacks.results}
      DISCOVERY_ROD_ENABLED: "true"
      CHROME_PATH: /usr/bin/chromium
      DISCOVERY_ROD_NO_SANDBOX: "true"
      DISCOVERY_BROWSER_LAUNCH_TIMEOUT: 90s
      DISCOVERY_CDP_URL: ${DISCOVERY_CDP_URL:-}
      DISCOVERY_PROXY: ${DISCOVERY_PROXY:-}
      TARGET_LOCALHOST_REWRITE: ""
      ATTACK_REQUEST_TIMEOUT: ${ATTACK_REQUEST_TIMEOUT:-30s}
      BROWSER_STATE_KEY: ${BROWSER_STATE_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  capture:
    profiles: ["stack"]
    build:
      context: ./workers/capture
      dockerfile: Dockerfile
    container_name: shingeki-capture
    restart: unless-stopped
    shm_size: "1gb"
    network_mode: host
    environment:
      CAPTURE_SERVICE_TOKEN: ${CAPTURE_SERVICE_TOKEN:-}
      CAPTURE_SERVICE_PORT: "7900"
      CAPTURE_SERVICE_HOST: 127.0.0.1
      CAPTURE_NOVNC_BIND: 127.0.0.1:6080

networks:
  shingeki:
    driver: bridge

volumes:
  mysql_data:
    driver: local
