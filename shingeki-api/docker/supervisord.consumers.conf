[supervisord]
nodaemon=true
user=root

[program:attacks]
command=php /var/www/html/artisan attacks:consume-results
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:catalog]
command=php /var/www/html/artisan catalog:consume-imports
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
